<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TYPE//DEFENSE</title>
  <style>
    :root {
      --bg: #070a12;
      --fg: #e6f1ff;
      --dim: #8aa0b8;
      --c1: #35e0ff;
      --c2: #ff4d8d;
      --c3: #ffd23f;
      --ok: #4dff9a;
      --bad: #ff5a5a;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.4 ui-monospace, Menlo, Consolas, monospace;
      overflow: hidden
    }

    #app {
      position: fixed;
      inset: 0;
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px)
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    button {
      font: inherit;
      color: var(--fg);
      background: #101a2c;
      border: 1px solid #2a4468;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer
    }

    button:hover {
      border-color: var(--c1)
    }

    button:focus-visible {
      outline: 3px solid var(--c3);
      outline-offset: 2px
    }

    button[aria-pressed=true] {
      background: #0d3a4a;
      border-color: var(--c1)
    }

    .hide {
      display: none !important
    }

    #top {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      align-items: center;
      pointer-events: none
    }

    .b {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .b i,
    .bar {
      display: block;
      width: 120px;
      height: 12px;
      border: 1px solid #3a5a80;
      background: #0a1220
    }

    .bar {
      width: 100%
    }

    .b u,
    .bar u {
      display: block;
      height: 100%;
      background: var(--ok);
      text-decoration: none
    }

    .en u {
      background: var(--c1)
    }

    #info {
      position: absolute;
      top: 44px;
      left: 8px;
      right: 8px;
      color: var(--dim);
      font-size: 13px;
      pointer-events: none
    }

    #info b {
      color: var(--c3)
    }

    #pbtn {
      position: absolute;
      top: 4px;
      right: 8px
    }

    #ch {
      position: absolute;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      width: min(560px, 92vw);
      background: #0b1424ee;
      border: 2px solid var(--c1);
      border-radius: 8px;
      padding: 10px 14px;
      text-align: center
    }

    #chl {
      color: var(--dim);
      font-size: 13px
    }

    #wd {
      font-size: 34px;
      letter-spacing: 6px;
      margin: 4px 0;
      min-height: 44px
    }

    .ok {
      color: var(--ok)
    }

    .bad {
      color: var(--bad);
      text-decoration: underline
    }

    .nx {
      border-bottom: 3px solid var(--c3)
    }

    .mk {
      color: var(--fg)
    }

    .mm {
      color: var(--dim)
    }

    #bufd {
      position: absolute;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      color: var(--c3);
      letter-spacing: 3px;
      min-height: 20px
    }

    #toast {
      position: absolute;
      left: 50%;
      top: 30%;
      transform: translateX(-50%);
      font-size: 20px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 8px #000;
      width: 90vw
    }

    #abs {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 6px
    }

    #abs button {
      min-width: 120px;
      font-size: 13px;
      line-height: 1.2
    }

    #abs button small {
      display: block;
      color: var(--dim)
    }

    #abs button.cd {
      opacity: .55
    }

    #abs button.lk {
      opacity: .4;
      border-style: dashed
    }

    .ov {
      position: absolute;
      inset: 0;
      background: #070a12ee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 12px
    }

    .card {
      max-width: 640px;
      width: 100%;
      margin: auto
    }

    h1 {
      font-size: 40px;
      margin: 0;
      color: var(--c1);
      letter-spacing: 4px
    }

    h2 {
      margin: 12px 0 4px;
      font-size: 14px;
      color: var(--c3)
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 6px 0
    }

    p,
    li {
      color: var(--dim);
      margin: 4px 0
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    td {
      padding: 3px 6px;
      border-bottom: 1px solid #1d2c44
    }

    td+td {
      text-align: right
    }

    input[type=range] {
      accent-color: var(--c1);
      flex: 1;
      min-width: 180px;
      height: 28px
    }
  </style>
</head>

<body>
  <div id="app"><canvas id="c"></canvas>
    <div id="top">
      <div class="b"><span>HEALTH</span><i><u id="hpb"></u></i><b id="hpn"></b></div>
      <div class="b en"><span>ENERGY</span><i><u id="enb"></u></i><b id="enn"></b></div><span>SCORE <b
          id="sc"></b></span><span>WAVE <b id="wv"></b></span><span>CHAIN <b id="chn"></b> <small
          id="mul"></small></span><span>TIME <b id="tm"></b></span>
    </div>
    <button id="pbtn" class="hide">Pause (Esc)</button>
    <div id="info"></div>
    <div id="ch" class="hide" aria-live="polite">
      <div id="chl"></div>
      <div id="wd"></div><i class="bar"><u id="chb"></u></i>
    </div>
    <div id="bufd"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="abs" class="hide"></div>
  </div>
  <div id="menu" class="ov">
    <div class="card">
      <h1>TYPE//DEFENSE</h1>
      <p>Rotate your turret across five lanes, then type to fire. Speed and accuracy decide who survives.</p>
      <h2>ROTATION CONTROL</h2>
      <div class="row" id="gc"><button data-v="cmd">Command: type LEFT / RIGHT</button><button data-v="ad">A / D
          keys</button></div>
      <h2>WORD CHALLENGE</h2>
      <div class="row" id="gm"><button data-v="mem">Memory Window (word hides)</button><button data-v="vis">Visible
          Word</button></div>
      <h2>ENEMY SPEED</h2>
      <div class="row" style="align-items:center"><input id="spd" type="range" min="0.7" max="1.5" step="0.05"
          aria-label="Enemy speed multiplier"><b id="spdv"></b></div>
      <p id="spdd"></p>
      <h2>SETTINGS</h2>
      <div class="row"><button id="snd" aria-pressed="true">Sound</button><button id="rm" aria-pressed="false">Reduced
          motion</button></div>
      <h2>HOW TO PLAY</h2>
      <ul id="how"></ul>
      <div class="row"><button id="play" style="background:#0d4a3a;font-size:18px">▶ PLAY</button></div>
      <h2>LOCAL BEST SCORES</h2>
      <table id="recs"></table>
    </div>
  </div>
  <div id="pause" class="ov hide">
    <div class="card">
      <h1>PAUSED</h1>
      <p id="pwhy">Gameplay is frozen.</p>
      <div class="row"><button id="res">Resume</button><button id="rst">Restart run</button><button
          id="mnu">Menu</button></div>
    </div>
  </div>
  <div id="over" class="ov hide">
    <div class="card">
      <h1 style="color:var(--c2)">BASE LOST</h1>
      <table id="stats"></table>
      <div class="row"><button id="again">Restart</button><button id="mnu2">Menu</button></div>
    </div>
  </div>
  <script>
    const $ = i => document.getElementById(i), cv = $('c'), X = cv.getContext('2d');
    // ===== CONFIG (all balance lives here) =====
    const C = {
      R: 400, BASE: 38, HP: 100, EN: 100, proj: 650, shotDmg: 1, failEn: 12, cancelEn: 12 /* Esc-cancel base penalty; ability prompts scale by ab.fail/failEn */, perChar: .22, minT: 1.2, maxT: 9, memBase: 0, memChar: .12, memTier: .1, memMin: .6, memMax: 2.2, // spawn pacing: first enemy after `first` s, then gap = start - step*(wave-1), floored at min, +/- jit random
      spawn: { first: 1.8, start: 3.2, step: .12, min: 1.9, jit: .15, waveLen: 30, speedGrow: .02, speedCap: 1.4 },
      // Spawn Director: type gaps (seconds and spawn counts), soft active limits, threat budget
      dir: { tankWave: 4, tank2Wave: 9, tankGap: 16, tankSpawns: 4, tankW: .5, disWave: 3, dis2Wave: 8, disGap: 14, disSpawns: 3, disW: .4, thr: { runner: 1, tank: 3, disruptor: 2 }, bud0: 5, budWave: .8, budMax: 14 },
      // enemy-speed slider categories: value < max -> label + score multiplier
      diff: [{ max: .875, n: 'Easy', m: .8 }, { max: 1.125, n: 'Medium', m: 1 }, { max: 99, n: 'Hard', m: 1.5 }],
      enT: [[0, 1], [25, 1.5], [50, 2], [75, 2.5], [100, 3]], disDur: 8, disMul: .8, disEn: 20, chainEvery: 5, chainEn: 6, maxEnemies: 10,
      en: { runner: { sp: 38, hp: 1, dmg: 8, pts: 10, r: 14, col: '#35e0ff', L: 'R' }, tank: { sp: 15, hp: 4, dmg: 22, pts: 40, r: 24, col: '#ff9a3c', L: 'T' }, disruptor: { sp: 24, hp: 3, dmg: 10, pts: 25, r: 17, col: '#ff4d8d', L: 'D' } },
      ab: [{ n: 'PULSE', tier: 0, dmg: 2, pierce: 0, cd: 6, un: 50, fail: 12, tm: 1, col: '#35e0ff' },
           { n: 'EMP', tier: 1, dmg: 0, cd: 25, un: 150, fail: 15, tm: 1, freeze: 4, col: '#7aa8ff' },
           { n: 'PIERCER', tier: 2, dmg: 2, pierce: 1, cd: 12, un: 400, fail: 15, tm: 1.1, col: '#d56bff' },
           { n: 'OVERLOAD', tier: 3, dmg: 8, pierce: 1, cd: 30, un: 700, all: 1, fail: 35, tm: 1.2, col: '#ff7a2a' }
          ]
    };
    const W = [['cat', 'sun', 'run', 'blue', 'fire', 'moon', 'star', 'lamp', 'sand', 'wind', 'rock', 'tree', 'jump', 'gold'], ['planet', 'rocket', 'signal', 'shield', 'garden', 'bridge', 'jungle', 'silver', 'window', 'memory'], ['quantum', 'gravity', 'network', 'crystal', 'thunder', 'balance', 'fortune', 'mystery'], ['bookkeeper', 'synchronize', 'labyrinth', 'whirlwind', 'xylophone', 'symphonic', 'tranquility', 'juxtapose']];
    // ===== storage =====
    const LS = 'typedef.'; const ld = k => { try { const v = JSON.parse(localStorage.getItem(LS + k)); return v && typeof v === 'object' ? v : {} } catch { return {} } }, sv = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)) } catch { } };
    let S = Object.assign({ ctrl: 'cmd', mode: 'mem', sound: true, rm: false, spd: 1 }, ld('s'));
    if (!['cmd', 'ad'].includes(S.ctrl)) S.ctrl = 'cmd'; if (!['mem', 'vis'].includes(S.mode)) S.mode = 'mem'; S.sound = S.sound !== false; S.rm = S.rm === true; S.spd = Math.min(1.5, Math.max(.7, Math.round((+S.spd || 1) * 20) / 20));
    const key = () => S.ctrl + '-' + S.mode, names = { 'cmd-mem': 'Command + Memory', 'cmd-vis': 'Command + Visible', 'ad-mem': 'A/D + Memory', 'ad-vis': 'A/D + Visible' };
    // ===== helpers =====
    const cl = (v, a, b) => Math.min(b, Math.max(a, v)), LA = i => -Math.PI / 2 + i * 2 * Math.PI / 5, fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
    function enTime(e) { const t = C.enT; for (let i = 1; i < t.length; i++)if (e <= t[i][0]) { const [a, b] = [t[i - 1], t[i]]; return a[1] + (b[1] - a[1]) * (e - a[0]) / (b[0] - a[0]) } return t[t.length - 1][1] }
    const dinfo = v => C.diff.find(d => v < d.max) || C.diff[2], dtxt = v => dinfo(v).n + ' (' + v.toFixed(2) + 'x speed)';
    let au = null;
    function initAudio() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) throw new Error('Web Audio API is not supported by this browser.');
        au = au || new AudioCtx();
        if (au.state === 'suspended') au.resume().catch(err => console.warn('Could not resume audio:', err));
      } catch (err) {
        console.error('Audio initialization failed:', err);
      }
    }
    function beep(f, d = .1, ty = 'sine') {
      if (!S.sound || !au) return;
      try {
        if (au.state === 'suspended') au.resume().catch(err => console.warn('Could not resume audio:', err));
        const o = au.createOscillator(), g = au.createGain();
        o.type = ty;
        o.frequency.value = f;
        g.gain.setValueAtTime(.05, au.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, au.currentTime + d);
        o.connect(g);
        g.connect(au.destination);
        o.start();
        o.stop(au.currentTime + d);
      } catch (err) {
        console.warn('Sound effect failed:', err);
      }
    }
    let tt = 0; function toast(m, c) { const t = $('toast'); t.textContent = m; t.style.color = c || 'var(--fg)'; clearTimeout(tt); tt = setTimeout(() => t.textContent = '', 2200) }
    // ===== state =====
    let G = null, mode = 'menu', raf = 0, last = 0;
    function newRun() {
      G = {
        t: 0, hp: C.HP, en: C.EN, score: 0, chain: 0, best: 0, lane: 0, ang: LA(0), wave: 1, E: [], P: [], F: [], ch: null, buf: '', bufT: 0, cd: [0, 0, 0, 0], un: [0, 0, 0, 0], dis: 0, flash: 0, shake: 0, emp: 0, sp: C.spawn.first, paused: false, prog: 0, spdMul: S.spd, sm: dinfo(S.spd).m, dir: { tT: -99, tD: -99, sT: 99, sD: 99 },
        kills: { runner: 0, tank: 0, disruptor: 0 }, ok: 0, fail: 0, keys: 0, right: 0, recent: [], pk: 0, pa: 0, warn: 0
      };
      mode = 'play';['menu', 'pause', 'over'].forEach(i => $(i).classList.add('hide'));['abs', 'pbtn'].forEach(i => $(i).classList.remove('hide')); buildAbs(); toast('Wave 1 — type SHOOT to begin', 'var(--c1)'); cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop)
    }
    // score = displayed (x difficulty multiplier, once); prog = unlock progress (chain bonus only, difficulty-independent)
    function add(p) { const b = p * (1 + Math.min(G.chain, 20) * .05); G.score += Math.round(b * G.sm); G.prog += Math.round(b); C.ab.forEach((a, i) => { if (!G.un[i] && G.prog >= a.un) { G.un[i] = 1; toast('UNLOCKED: ' + a.n + ' (key ' + (i + 1) + ')', 'var(--c3)'); beep(880, .3) } }) }
    function rot(d) { G.lane = (G.lane + d + 5) % 5; toast((d < 0 ? '◀ LEFT' : 'RIGHT ▶') + ' → Lane ' + (G.lane + 1), 'var(--c1)'); beep(300, .05) }
    function startCh(ai) {
      if (G.ch) return; const ab = ai >= 0 ? C.ab[ai] : { n: 'SHOT', tier: Math.min(2, Math.floor((G.wave - 1) / 3)), tm: 1, fail: C.failEn, col: '#ffd23f' }; let w, n = 0;
      do { w = W[ab.tier][Math.floor(Math.random() * W[ab.tier].length)] } while (G.recent.includes(w) && n++ < 20); G.recent = [w, ...G.recent].slice(0, 5);
      const lim = cl((enTime(G.en) + C.perChar * w.length) * ab.tm * (G.dis > 0 ? C.disMul : 1), C.minT, C.maxT), m = S.mode === 'mem', sm = m ? cl(C.memBase + C.memChar * w.length + C.memTier * ab.tier, C.memMin, C.memMax) : 0;
      G.ch = { ai, ab, lane: G.lane, word: w, typed: '', lim, left: lim, phase: m ? 'show' : 'type', show: sm, showMax: sm }; G.buf = ''; beep(500, .06)
    }
    function endCh(ok, why) {
      const c = G.ch; G.ch = null;
      if (ok) { G.ok++; G.chain++; G.best = Math.max(G.best, G.chain); if (G.chain % C.chainEvery === 0) { G.en = Math.min(C.EN, G.en + C.chainEn); toast('CHAIN ×' + G.chain + '  +' + C.chainEn + ' ENERGY', 'var(--ok)') } beep(660, .1); fire(c) }
      else { G.fail++; G.chain = 0; G.en = Math.max(0, G.en - c.ab.fail); G.shake = .3; toast('FAILED (' + why + ') −' + c.ab.fail + ' ENERGY · word was “' + c.word + '”', 'var(--bad)'); beep(110, .25, 'sawtooth') }
    }
    function fire(c) {
      const a = c.ab; if (c.ai >= 0) { G.cd[c.ai] = a.cd; add(15); G.pa++ }
      if (a.all) { // OVERLOAD: independent full-damage piercing projectile down every lane; each enemy lives in one lane so is hit once
        for (let l = 0; l < 5; l++) { G.P.push({ lane: l, d: C.BASE, prev: C.BASE, dmg: a.dmg, pierce: true, hit: new Set(), col: a.col, big: true }); boom(Math.cos(LA(l)) * C.BASE, Math.sin(LA(l)) * C.BASE, a.col, 8) }
        G.blast = .8; G.shake = Math.max(G.shake, .25); toast('OVERLOAD — all 5 lanes hit', 'var(--c3)'); return
      }
      if (a.freeze) { G.E.forEach(e => e.fz = a.freeze); G.emp = .7; toast('EMP — enemies frozen ' + a.freeze + 's', 'var(--c1)'); return }
      G.P.push({ lane: c.lane, d: C.BASE, prev: C.BASE, dmg: c.ai >= 0 ? a.dmg : C.shotDmg, pierce: !!a.pierce, hit: new Set(), col: a.col, big: c.ai === 3 })
    }
    // Cancelling costs Energy exactly once (G.ch is cleared first, so a repeat Esc pauses instead) and breaks the chain like a failure,
    // so it is never cheaper than failing; it grants nothing and starts no cooldown.
    function cancelCh() { const c = G.ch, pen = Math.round(C.cancelEn * c.ab.fail / C.failEn); G.ch = null; G.buf = ''; ck = ''; G.chain = 0; G.en = Math.max(0, G.en - pen); G.shake = Math.max(G.shake, .15); toast('Prompt cancelled −' + pen + ' ENERGY', 'var(--c3)'); beep(200, .12, 'square') }
    function tryAb(i) {
      const a = C.ab[i]; let m = ''; if (G.ch) m = 'Finish the current challenge first'; else if (!G.un[i]) m = a.n + ' unlocks at ' + a.un + ' progress pts (you have ' + G.prog + ')'; else if (G.cd[i] > 0) m = a.n + ' cooling down (' + Math.ceil(G.cd[i]) + 's)';
      if (m) return toast(m, 'var(--c3)'); startCh(i)
    }
    function key_(e) {
      if (mode !== 'play') return; const k = e.key;
      if (k === 'Escape' && G.ch && !G.paused) { if (!e.repeat) cancelCh(); e.preventDefault(); return }
      if (k === 'Escape') { if (!e.repeat) pauseT(); e.preventDefault(); return }
      if (G.paused) return; if (k === ' ' || k === 'Backspace' || k.startsWith('Arrow')) e.preventDefault(); if ((e.repeat && k !== 'Backspace') || e.ctrlKey || e.metaKey || e.altKey) return;
      const c = G.ch;
      if (c) { if (c.phase === 'show') return; if (k === 'Backspace') c.typed = c.typed.slice(0, -1); else if (/^[a-z]$/i.test(k) && c.typed.length < c.word.length) { const ch = k.toLowerCase(); G.keys++; if (ch === c.word[c.typed.length]) G.right++; else beep(130, .06, 'square'); c.typed += ch; if (c.typed === c.word) endCh(true) } return }
      if (S.ctrl === 'ad' && /^[ad]$/i.test(k)) return rot(k.toLowerCase() === 'a' ? -1 : 1);
      if (/^[1-4]$/.test(k)) return tryAb(+k - 1);
      if (k === 'Backspace') { G.buf = G.buf.slice(0, -1); return }
      if (/^[a-z]$/i.test(k)) {
        G.buf = (G.buf + k.toUpperCase()).slice(-8); G.bufT = 2.5;
        if (G.buf.endsWith('SHOOT')) { G.buf = ''; startCh(-1) } else if (S.ctrl === 'cmd' && G.buf.endsWith('LEFT')) { G.buf = ''; rot(-1) } else if (S.ctrl === 'cmd' && G.buf.endsWith('RIGHT')) { G.buf = ''; rot(1) }
      }
    }
    addEventListener('keydown', key_);
    function pauseT(why) { if (mode !== 'play') return; G.paused = !G.paused; $('pause').classList.toggle('hide', !G.paused); $('pwhy').textContent = why || 'Gameplay is frozen: enemies, timers and cooldowns are stopped.'; $('rst').textContent = 'Restart run'; if (G.paused) $('res').focus() }
    addEventListener('blur', () => { if (mode === 'play' && !G.paused) pauseT('Paused because the window lost focus, so you do not lose time unfairly.') });
    // ===== simulation =====
    function nextGap() { const q = C.spawn; return Math.max(q.min, q.start - q.step * (G.wave - 1)) * (1 - q.jit + Math.random() * 2 * q.jit) }
    // Spawn Director: weighted pick among types allowed by gaps, soft active limits and a threat budget
    function pickType() {
      const D = C.dir, w = G.wave, t = G.t, d = G.dir, E = G.E, nT = E.filter(e => e.type === 'tank').length, nD = E.filter(e => e.type === 'disruptor').length;
      const thr = E.reduce((a, e) => a + D.thr[e.type], 0), bud = Math.min(D.budMax, D.bud0 + D.budWave * w), wt = { runner: 1 + 2 * nT + nD };
      if (w >= D.tankWave && nT < (w >= D.tank2Wave ? 2 : 1) && t - d.tT >= D.tankGap && d.sT >= D.tankSpawns && thr + D.thr.tank <= bud) wt.tank = D.tankW * cl((w - D.tankWave + 1) / 4, .25, 1);
